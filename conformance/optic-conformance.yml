provider: Optic
providerId: optic
description: >-
  Standards conformance for Optic. Optic exposes no API of its own, so there is
  no runtime contract to assert against. What is real and evidenced here is the
  set of specifications the TOOL reads, writes and enforces — which is the
  meaningful conformance surface for an API-governance product.
api_conformance:
  applicable: false
  note: >-
    Optic publishes no callable API. The Optic Cloud REST backend
    (api.useoptic.com) was disconnected from the CLI at v1.0.0 in August 2024
    and the host no longer resolves, so there is nothing to test for oauth2,
    oidc, rfc9457, pagination, idempotency or any other runtime convention.
    See lifecycle/optic-lifecycle.yml.
conformance:
  - id: openapi-3.0
    name: OpenAPI Specification 3.0.x
    conforms: true
    role: consumes-and-emits
    evidence: >-
      projects/openapi-utilities/src/index.ts imports OpenAPIV3 from
      openapi-types and the traverser walks 3.0 documents; the CLI diffs, lints,
      bundles and dereferences 3.0 specs.
  - id: openapi-3.1
    name: OpenAPI Specification 3.1
    conforms: true
    role: consumes-and-emits
    evidence: >-
      projects/openapi-utilities/src/index.ts imports OpenAPIV3_1 and exports
      FlatOpenAPIV3_1; polymorphic 3.1 schema fixtures ship under
      projects/openapi-utilities/inputs/openapi3/polymorphic-schemas-3_1.json.
  - id: swagger-2.0
    name: OpenAPI / Swagger 2.0
    conforms: partial
    role: consumes
    evidence: >-
      OpenAPIV2 is imported in projects/openapi-utilities/src/index.ts. Read
      support only; Optic's rulesets and capture path target OpenAPI 3.x.
  - id: json-schema
    name: JSON Schema
    conforms: true
    role: consumes-and-emits
    evidence: >-
      Optic infers and patches request/response schemas from observed traffic
      during `optic capture`, and its shape-generation tests live at
      projects/optic/src/commands/oas/tests/shapes/.
  - id: rfc6901
    name: 'RFC 6901: JavaScript Object Notation (JSON) Pointer'
    conforms: true
    role: implements
    evidence: >-
      Published as the first-party library @useoptic/json-pointer-helpers and
      used to address every node Optic reports a change or violation against.
  - id: spectral
    name: Spectral rulesets
    conforms: true
    role: executes
    evidence: >-
      projects/standard-rulesets/src/spectral ships a Spectral bridge; the wiki
      documents it at
      https://github.com/opticdev/optic/wiki/Running-Spectral-Rules
  - id: har-1.2
    name: 'HAR 1.2 / 1.3 (HTTP Archive)'
    conforms: true
    role: consumes
    evidence: >-
      `optic capture --har <har-file or directory>` accepts HAR v1.2 and v1.3;
      documented at
      https://github.com/opticdev/optic/wiki/Using-Optic-Capture-with-HAR
  - id: postman-collection
    name: Postman Collection
    conforms: true
    role: consumes
    evidence: >-
