domain_standard:
  market: API governance and contract testing
  standard: OpenAPI Specification
  declared: true
  evidence: >-
    Optic declares its alignment with OpenAPI inside the contracts it operates
    on, via four reserved vendor extensions registered in
    projects/optic/src/constants.ts — x-optic-url, x-optic-standard,
    x-optic-path-ignore and x-optic-ci-empty-spec — and its built-in ruleset
    families (breaking-changes, documentation, examples, naming-changes,
    spectral, lintgpt) are expressed against the OpenAPI object model rather
    than a bespoke one.
  note: >-
    Recorded as a domain-standard signature read from the artifact surface, not
    from a marketing claim. Optic is a consumer and enforcer of the standard
    rather than a service that publishes a conformant contract of its own.
compliance:
  certifications: []
  note: >-
    No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP attestation is published for
    Optic. There is no trust center. The only security surface on the domain is
    the acquirer's corporate security.txt, so no Compliance pointer is emitted.
