description: >-
  Optic publishes no plans or pricing. The product is the MIT-licensed Optic CLI
  and its @useoptic npm libraries, which are free to download and run. The paid
  hosted tier (Optic Cloud) was disconnected from the CLI at v1.0.0 in August
  2024 and its hosts no longer resolve, so there is no commercial surface left
  to record.
