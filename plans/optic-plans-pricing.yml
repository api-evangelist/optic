license: MIT
note: >-
  SUPERSEDES A SCAFFOLD. Until 2026-08-29 this file carried a three-tier
  Free/Professional/Enterprise structure with invented request quotas, rate
  limits and TBD prices, written by the 2026-05-04 bulk sweep and never
  harvested from Optic. None of it was ever published by the provider. It has
  been replaced with the honest zero.
