apis:
  - aid: optic:optic-cli
    name: Optic CLI
    description: >-
      The Optic CLI provides OpenAPI diffing, linting and breaking-change
      detection from the command line, comparing two versions of an OpenAPI
      specification with behaviour-aware diffing and applying style-guide rules
      with forwards-only governance. It runs entirely locally against files in a
      git working tree and requires no credential; the optional Optic Cloud
      upload targets were removed at v1.0.0 and their hosts no longer resolve.
