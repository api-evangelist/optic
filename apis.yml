aid: optic
name: Optic
description: >-
  Optic is an MIT-licensed command-line tool for OpenAPI linting, diffing and
  testing. It compares two versions of an OpenAPI document with behaviour-aware
  diffing to catch breaking changes before they ship, enforces style-guide
  rulesets (breaking-changes, documentation, examples, naming-changes, Spectral
  and lintgpt), and generates or verifies OpenAPI from captured test traffic via
  HAR files, Postman collections or a local proxy. Optic Labs was acquired by
  Atlassian in April 2024; the hosted Optic Cloud service was disconnected from
  the CLI at v1.0.0 in August 2024, the documentation site was retired in favour
  of the GitHub Wiki, and the source repository was archived read-only in
  January 2026 after a final v1.0.9 release. Optic publishes no callable API of
  its own — it is a tool that consumes and governs other people's contracts.
