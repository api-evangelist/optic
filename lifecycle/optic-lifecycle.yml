description: >-
  Lifecycle record for Optic. Optic Labs was acquired by Atlassian in April 2024.
  The hosted product (Optic Cloud) was disconnected from the CLI at v1.0.0 in
  August 2024 and its hosts no longer resolve; the open-source CLI continued
  under MIT until the repository was archived on GitHub. Optic today is a frozen
  open-source tool with no service, no API and no maintained documentation site.
